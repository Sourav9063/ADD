<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Driven Development</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2c313c;--text:#e8eaf0;--muted:#a6adbb;--acc:#7aa2ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:960px;margin:0 auto;padding:48px 28px}
h1{margin:0 0 16px;font-size:clamp(40px,7vw,76px);line-height:1.05;letter-spacing:-.01em}
p{margin:0 0 40px;font-size:clamp(20px,2.6vw,30px);line-height:1.4;color:var(--muted)}
a.deck{display:inline-block;align-self:flex-start;background:var(--acc);color:#0f1115;font-weight:700;font-size:clamp(20px,2.6vw,28px);text-decoration:none;padding:18px 32px;border-radius:14px}
a.deck:hover,a.deck:focus-visible{outline:4px solid #fff;outline-offset:3px}
small{margin-top:28px;color:var(--muted);font-size:18px}
</style>
</head>
<body>
<main>
<h1>Agent Driven Development</h1>
<p>Reusable coding-agent guidance and the workflow behind it.</p>
<a class="deck" href="slides/claude/">Claude Code workflow deck</a>
<small>Keyboard: arrow keys or space to move, Home and End to jump.</small>
</main>
</body>
</html>
